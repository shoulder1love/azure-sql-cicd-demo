trigger:
- main

pool:
  name: Default   # 使用你本地 agent

variables:
- group: sql-demo-vars

stages:
- stage: CI
  displayName: CI - Test Python App
  jobs:
  - job: test
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies

    - script: |
        pytest
      displayName: Run tests

- stage: CD
  displayName: CD - Deploy SQL
  dependsOn: CI
  jobs:
  - job: deploy_sql
    steps:
    - powershell: |
        Write-Host "Installing SQL tools..."

        # 安装 sqlcmd（如果没装）
        choco install sqlcmd -y
      displayName: Install SQL tools

    - powershell: |
        Write-Host "Running SQL script..."

        sqlcmd -S $(SQL_SERVER_NAME).database.windows.net `
               -d $(SQL_DATABASE_NAME) `
               -U $(SQL_ADMIN_USER) `
               -P "$(SQL_ADMIN_PASSWORD)" `
               -i sql/init.sql
      displayName: Execute SQL script
